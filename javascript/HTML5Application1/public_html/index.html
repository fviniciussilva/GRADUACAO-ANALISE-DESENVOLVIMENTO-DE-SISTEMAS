    <body>
        <div>
            <<h1>AULA 1 DE JAVASCRIPT</h1> 
            <p id="mensagem">clicar no botão que quiser</p>
            <p id="modificarmensagem">Mensagem inicial</p>
            <button onclick="mudar()">clique aqui</button>
            <button onclick="Clicou()">Primeiro Botão</button>
            
            <button onclick="Clicou2()">Segundo Botão</button>
            
            <button onclick="Clicou3 ()">terceiro botão</button>
            
            <script>
               function Clicou()
               {
                document.getElementById("mensagem").innerHTML="Deu certo";   
                   
             }
               function Clicou2()
               { document.getElementById("mensagem").innerHTML="Deu certo denovo";}
               
               function Clicou3()
               { document.getElementById("mensagem").innerHTML="DEu certo pela 3x";}
               function mudar() {
                   document.getElementById("modificarmensagem").innerHTML="Nova mensagem";
               }
                   
              
        
            </script>
        </div>
