    <body>
        <button onclick= chamar() id="botao">exercicio </button>
        <p id="mensagem">resultado da tabuada</p>

            function chamar(){
              let texto=" ";
              for(let valor=1; valor<=10; valor+=2){
             
              texto += valor + "<br>";}
            
            document.getElementById("mensagem").innerHTML=texto;
            
            }
            
            
        </script>
