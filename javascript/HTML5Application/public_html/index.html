<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    </head>
    <body>
        <h1>1º Programa Web</h1>
        <p id="mensagem">Clique no botão logo abaixo.</p>

        <button onclick="mostrarMensagem()">
     <script>
       function mostrarMensagem(){
           document.getElementById("mensagem").innerHTML = "Oi Fernando! O seu Javascript está funcionando perfeitamente !";
       }           
                
     </script>       
           Clique aqui Fernando
        </button>
    </body>
</html>
