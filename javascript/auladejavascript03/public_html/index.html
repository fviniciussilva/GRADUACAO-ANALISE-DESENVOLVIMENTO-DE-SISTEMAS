<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            <h1>Calculadora de Média</h1>
            <label>Nome:</label>
            <input type="text" id="nome">
            <br><br><!-- comment -->
            <label>Nota 1 :</label>
            <input type="text" id="nota1">
            <br>
            <label>Nota 2:</label>
            <br>
            <input type="number" id="nota2"><!-- comment -->
            <br><br><!-- comment -->
            <button onclick="calcular()">
                Calcular Média 
            </button>
            <p id="resultado"> </p>
            
            
            
            
        </div>
        <script>
           function calcular(){
               let nome = document.getElementById("nome").value;
               let nota1 = Number(document.getElementById("nota1").value);
               let nota2 = Number(document.getElementById("nota2").value);
               let media = (nota1+nota2)/2;
               let resultados01;
               if (media >=7){
                   resultados01 ="Aprovado";
               }
               else {
                   resultados01 = "Reprovado";
               }
               document.getElementById("resultado").innerHTML = "Aluno:"+ nome+ "<br>"+"Media"+ media +"<br>"+"Situaçao:"+resultados01;
               }
               
               
           
           
        </script>
    </body>
</html>
