function useLocalStorage(key, initial){
  const [v,setV]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):initial}catch(e){return initial}});
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(v))}catch(e){}},[key,v]);
  return [v,setV];
}
function useReveal(deps){
  const ref=useRef(null);
  useEffect(()=>{
    const els=ref.current?ref.current.querySelectorAll('.card-reveal'):[];
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08});
    els.forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },deps);
  return ref;
}

function PhaseCard({phase,idx,query,checked,toggleTopic}){
  const [open,setOpen]=useState(idx<2);
  const q=query.trim().toLowerCase();
  const topics=phase.topics.map((tp,i)=>({...tp,key:idx+"-"+i})).filter(tp=>!q||tp.t.toLowerCase().includes(q)||tp.d.toLowerCase().includes(q));
  if(q && topics.length===0) return null;
  const done=phase.topics.filter((_,i)=>checked[idx+"-"+i]).length;
  const pct=Math.round(done/phase.topics.length*100);
  return (<article id={"fase-"+idx} className="card-reveal scroll-mt-24 rounded-3xl overflow-hidden bg-white/[.04] border border-white/10 hover:border-white/25 transition shadow-xl">
    <button onClick={()=>setOpen(!open)} className="w-full text-left">
      <div className={"h-2 bg-gradient-to-r "+phase.color}></div>
      <div className="p-5 flex items-center gap-4">
        <div className={"w-14 h-14 rounded-2xl grid place-items-center text-3xl bg-gradient-to-br "+phase.color+" shrink-0"}>{phase.icon}</div>
        <div className="flex-1"><div className="flex items-center gap-2 flex-wrap">
          <h2 className="text-xl font-extrabold">Fase {idx+1}: {phase.title}</h2>
          {phase.isNew && <span className="text-[11px] font-black px-2 py-0.5 rounded-full bg-gradient-to-r from-cyan-400 to-violet-600 animate-pulse">✨ NOVA</span>}</div>
          <p className="text-sm text-slate-400">{phase.desc}</p>
          <div className="mt-2 h-2 rounded-full bg-white/10 overflow-hidden max-w-md"><div className={"h-full bg-gradient-to-r "+phase.color+" transition-all duration-500"} style={{width:pct+"%"}}></div></div>
          <p className="text-xs font-mono text-slate-400 mt-1">{done}/{phase.topics.length} • {pct}% {open?"▲":"▼"}</p>
        </div>
      </div>
    </button>
    {open && (<div className="px-5 pb-5">
      <div className="grid sm:grid-cols-2 gap-3">
        {topics.map(tp=>{const c=!!checked[tp.key];return (
          <label key={tp.key} className={"flex gap-3 p-3 rounded-2xl border cursor-pointer transition "+(c?"bg-emerald-500/10 border-emerald-400/40":"bg-white/[.04] border-white/10 hover:border-white/25")}>
            <input type="checkbox" checked={c} onChange={()=>toggleTopic(tp.key)} className="mt-1" />
            <span><span className={"block font-bold text-[15px] "+(c?"topic-done":"")}>{c?"✅ ":"⬜ "}{tp.t}</span>
            <span className="block text-[13px] text-slate-400 leading-snug">{tp.d}</span></span>
          </label>);})}
      </div>
      <details className="mt-3 rounded-2xl bg-amber-300/10 border border-amber-300/20 p-3">
        <summary className="font-bold text-amber-200 text-sm">📖 Recursos recomendados ({phase.resources.length}) — clique</summary>
        <ul className="mt-2 space-y-1">{phase.resources.map((r,i)=>(<li key={i} className="text-sm">🔗 <a href={r.url} target="_blank" rel="noreferrer" className="text-cyan-300 hover:underline">{r.label}</a></li>))}</ul>
      </details>
    </div>)}
  </article>);
}
